[org/gnome/shell]
enabled-extensions=['accent-directories@taiwbi.com', 'appindicatorsupport@rgcjonas.gmail.com', 'blur-my-shell@aunetx', 'burn-my-windows@schneegans.github.com', 'clipboard-history@alexsaveau.dev', 'caffeine@patapon.info', 'compiz-windows-effect@hermes83.github.com', 'gnome-ui-tune@itstime.tech', 'gsconnect@andyholmes.github.io', 'hotedge@jonathan.jdoda.ca', 'just-perfection-desktop@just-perfection', 'o-tiling@oliwebd.github.com', 'rounded-window-corners@fxgn', 'user-theme@gnome-shell-extensions.gcampax.github.com']
[org/gnome/shell/extensions/burn-my-windows]
active-profile='/usr/share/burn-my-windows/profiles/default.conf'
[org/gnome/shell/extensions/o-tiling]
tile-by-default=true
stacking-with-mouse=false
hint-color-rgba='rgb(44,143,215)'
active-hint=false
[org/gnome/shell/extensions/just-perfection]
support-notifier-type=0
world-clock=false
[org/gnome/shell/extensions/accent-directories]
blue-theme=['Papirus-Dark-Blue']
teal-theme=['Papirus-Dark-Teal']
green-theme=['Papirus-Dark-Green']
yellow-theme=['Papirus-Dark-Yellow']
orange-theme=['Papirus-Dark-Orange']
red-theme=['Papirus-Dark-Red']
pink-theme=['Papirus-Dark-Pink']
purple-theme=['Papirus-Dark-Violet']
slate-theme=['Papirus-Dark-Grey']
[org/gnome/shell/extensions/gnome-ui-tune]
increase-thumbnails-size='300%'
