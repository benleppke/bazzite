---
name: Build live ISOs

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: "Flavor to build"
        required: true
        default: all
        type: choice
        options:
          - all
          - bazzite-gnome
          - bazzite-gnome-nvidia
          - bazzite-deck-gnome
      upload-to-s3:
        description: "Upload to S3"
        required: false
        default: false
        type: boolean

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  DEFAULT_TAG: "latest"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  matrix:
    name: Compute flavor matrix
    runs-on: self-hosted
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Compute matrix
        id: matrix
        env:
          FLAVOR: ${{ inputs.flavor || 'all' }}
        run: |
          set -euo pipefail

          if [[ "${FLAVOR}" == "all" ]]; then
            flavors='["bazzite-gnome","bazzite-gnome-nvidia","bazzite-deck-gnome"]'
          else
            flavors="$(jq -cn --arg f "${FLAVOR}" '[$f]')"
          fi

          matrix="$(jq -cn --argjson flavors "${flavors}" '
            $flavors
            | map({
                flavor: .,
                payload_base: (if test("deck|nvidia") then "bazzite-gnome" else . end)
              })
            | {include: .}
          ')"

          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.flavor }} live ISO
    needs: matrix
    runs-on: self-hosted
    permissions:
      contents: read
      packages: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}

    steps:
      - name: Prepare environment
        env:
          PAYLOAD_BASE: ${{ matrix.payload_base }}
          TARGET_IMAGE: ${{ matrix.flavor }}
        run: |
          set -euo pipefail
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> "${GITHUB_ENV}"
          echo "PAYLOAD_BASE=${PAYLOAD_BASE,,}" >> "${GITHUB_ENV}"
          echo "TARGET_IMAGE=${TARGET_IMAGE,,}" >> "${GITHUB_ENV}"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Clean previous output
        run: rm -rf "${GITHUB_WORKSPACE}/output"

      - name: Check container storage space
        run: |
          set -euo pipefail
          graphroot="$(sudo podman info --format '{{.Store.GraphRoot}}')"
          available="$(df --output=avail -BG "${graphroot}" | tail -n 1 | tr -dc '0-9')"
          echo "Container storage: ${graphroot}"
          echo "Available space: ${available}G"
          if [[ -z "${available}" || "${available}" -lt 80 ]]; then
            echo "::error::Live ISO builds need at least 80G free in ${graphroot} (found ${available}G)."
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull base image
        run: |
          set -euo pipefail
          sudo podman pull "${IMAGE_REGISTRY}/${PAYLOAD_BASE}:${DEFAULT_TAG}"

      - name: Build installer payload
        run: |
          set -euo pipefail
          sudo podman build \
            --cap-add sys_admin \
            --security-opt label=disable \
            --build-arg BASE_IMAGE="${IMAGE_REGISTRY}/${PAYLOAD_BASE}:${DEFAULT_TAG}" \
            --build-arg INSTALL_IMAGE_PAYLOAD="${IMAGE_REGISTRY}/${TARGET_IMAGE}:${DEFAULT_TAG}" \
            --build-arg FLATPAK_DIR_SHORTNAME=gnome_flatpaks \
            -t "localhost/payload-${TARGET_IMAGE}:${DEFAULT_TAG}" \
            installer/

      - name: Build live ISO
        id: build
        uses: ublue-os/titanoboa@5c457c3d0518bd17e754be0fd98a60d29d26abb4
        with:
          image-ref: localhost/payload-${{ matrix.flavor }}:${{ env.DEFAULT_TAG }}
          iso-dest: ${{ github.workspace }}/output/${{ matrix.flavor }}-live-${{ env.DEFAULT_TAG }}-amd64.iso

      - name: Generate checksum
        run: |
          set -euo pipefail
          iso="${TARGET_IMAGE}-live-${DEFAULT_TAG}-amd64.iso"
          cd output
          sha256sum "${iso}" | tee "${iso}-CHECKSUM"

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign ISO
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          set -euo pipefail
          iso="output/${TARGET_IMAGE}-live-${DEFAULT_TAG}-amd64.iso"
          cosign sign-blob -y --key env://COSIGN_PRIVATE_KEY "${iso}" \
            --output-signature "${iso}.sig"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: output/*.iso

      - name: Upload ISO and checksum to job artifacts
        if: inputs.upload-to-s3 != true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.flavor }}-live-iso
          path: output/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true

      - name: Upload to S3
        if: inputs.upload-to-s3 == true
        shell: bash
        env:
          RCLONE_CONFIG_S3_TYPE: s3
          RCLONE_CONFIG_S3_PROVIDER: ${{ secrets.S3_PROVIDER }}
          RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_S3_REGION: ${{ secrets.S3_REGION }}
          RCLONE_CONFIG_S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          SOURCE_DIR: ${{ github.workspace }}/output
        run: |
          set -euo pipefail
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y rclone
          elif command -v dnf >/dev/null 2>&1; then
            sudo dnf install -y rclone
          else
            echo "::error::Install rclone on the runner before enabling S3 uploads."
            exit 1
          fi
          rclone copy "${SOURCE_DIR}" S3:${{ secrets.S3_BUCKET_NAME }}

      - name: Clean up payload image
        if: always()
        run: |
          set -euo pipefail
          sudo podman rmi -f "localhost/payload-${TARGET_IMAGE}:${DEFAULT_TAG}" || true

      - name: Clean up workspace output
        if: always()
        run: rm -rf "${GITHUB_WORKSPACE}/output"
