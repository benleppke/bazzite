---
name: Build live ISOs

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: "Flavor to build"
        required: true
        default: all
        type: choice
        options:
          - all
          - bazzite-gnome
          - bazzite-gnome-nvidia
          - bazzite-deck-gnome
  schedule:
    # Weekly on Sunday at 02:00 UTC, ahead of the daily image build at 08:10.
    - cron: '0 2 * * 0'

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  DEFAULT_TAG: "latest"
  ISO_BUCKET: ${{ vars.B2_BUCKET_NAME || 'benleppke-bazzite-isos' }}
  ISO_BASE_URL: "https://isos.benleppke.com/bazzite"
  LIVE_FLAVORS: "bazzite-gnome bazzite-gnome-nvidia bazzite-deck-gnome"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  matrix:
    name: Compute flavor matrix
    runs-on: self-hosted
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Compute matrix
        id: matrix
        env:
          FLAVOR: ${{ inputs.flavor || 'all' }}
        run: |
          set -euo pipefail

          if [[ "${FLAVOR}" == "all" ]]; then
            flavors='["bazzite-gnome","bazzite-gnome-nvidia","bazzite-deck-gnome"]'
          else
            flavors="$(jq -cn --arg f "${FLAVOR}" '[$f]')"
          fi

          matrix="$(jq -cn --argjson flavors "${flavors}" '
            $flavors
            | map({
                flavor: .,
                payload_base: (if test("deck|nvidia") then "bazzite-gnome" else . end)
              })
            | {include: .}
          ')"

          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.flavor }} live ISO
    needs: matrix
    runs-on: self-hosted
    permissions:
      contents: read
      packages: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}
    env:
      RCLONE_CONFIG_B2_TYPE: b2
      RCLONE_CONFIG_B2_ACCOUNT: ${{ secrets.B2_APPLICATION_KEY_ID }}
      RCLONE_CONFIG_B2_KEY: ${{ secrets.B2_APPLICATION_KEY }}

    steps:
      - name: Prepare environment
        env:
          PAYLOAD_BASE: ${{ matrix.payload_base }}
          TARGET_IMAGE: ${{ matrix.flavor }}
        run: |
          set -euo pipefail
          {
            echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}"
            echo "PAYLOAD_BASE=${PAYLOAD_BASE,,}"
            echo "TARGET_IMAGE=${TARGET_IMAGE,,}"
            echo "ISO_NAME=${TARGET_IMAGE,,}-live-amd64.iso"
            echo "BUILD_DATE=$(date -u +%F)"
          } >> "${GITHUB_ENV}"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Clean previous output
        run: sudo rm -rf "${GITHUB_WORKSPACE}/output"

      - name: Check disk space
        run: |
          set -euo pipefail
          graphroot="$(sudo podman info --format '{{.Store.GraphRoot}}')"
          container_avail="$(df --output=avail -BG "${graphroot}" | tail -n 1 | tr -dc '0-9')"
          workspace_avail="$(df --output=avail -BG "${GITHUB_WORKSPACE}" | tail -n 1 | tr -dc '0-9')"
          echo "Container storage: ${graphroot} (${container_avail}G free)"
          echo "Workspace: ${GITHUB_WORKSPACE} (${workspace_avail}G free)"
          if [[ -z "${container_avail}" || "${container_avail}" -lt 80 ]]; then
            echo "::error::Live ISO builds need at least 80G free in ${graphroot} (found ${container_avail}G)."
            exit 1
          fi
          if [[ -z "${workspace_avail}" || "${workspace_avail}" -lt 25 ]]; then
            echo "::error::Live ISO builds need at least 25G free in ${GITHUB_WORKSPACE} (found ${workspace_avail}G)."
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull base image
        run: |
          set -euo pipefail
          sudo podman pull "${IMAGE_REGISTRY}/${PAYLOAD_BASE}:${DEFAULT_TAG}"

      # Record which target image the ISO embeds. Best effort: the build itself
      # still uses the mutable tag, so a registry hiccup must not block it.
      - name: Resolve target image digest
        id: digest
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          digest="unknown"
          digest="$(sudo podman run --rm quay.io/skopeo/stable:latest \
            inspect --creds "${GHCR_USER}:${GHCR_TOKEN}" \
            --format '{{.Digest}}' \
            "docker://${IMAGE_REGISTRY}/${TARGET_IMAGE}:${DEFAULT_TAG}" 2>/dev/null)" || digest="unknown"
          [[ -n "${digest}" ]] || digest="unknown"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "Target image digest: ${digest}"

      - name: Build installer payload
        run: |
          set -euo pipefail
          sudo podman build \
            --cap-add sys_admin \
            --security-opt label=disable \
            --build-arg BASE_IMAGE="${IMAGE_REGISTRY}/${PAYLOAD_BASE}:${DEFAULT_TAG}" \
            --build-arg INSTALL_IMAGE_PAYLOAD="${IMAGE_REGISTRY}/${TARGET_IMAGE}:${DEFAULT_TAG}" \
            --build-arg FLATPAK_DIR_SHORTNAME=gnome_flatpaks \
            -t "localhost/payload-${TARGET_IMAGE}:${DEFAULT_TAG}" \
            installer/

      # Use the vendored builder instead of the Titanoboa action: the action's
      # iso-dest handling calls realpath on a file that does not exist yet and
      # fails after the ISO is built.
      - name: Build live ISO
        id: build
        run: |
          set -euo pipefail
          mkdir -p output
          sudo podman run --rm \
            --cap-add sys_admin \
            --security-opt label=disable \
            -v "${GITHUB_WORKSPACE}/output:/output" \
            -v "${GITHUB_WORKSPACE}/scripts/titanoboa/build_iso.sh:/src/build_iso.sh:ro" \
            --mount type=image,source="localhost/payload-${TARGET_IMAGE}:${DEFAULT_TAG}",dst=/rootfs \
            quay.io/fedora/fedora:latest \
            /src/build_iso.sh
          iso_file="$(find output -maxdepth 1 -name '*.iso' -print -quit)"
          if [[ -z "${iso_file}" ]]; then
            echo "::error::Titanoboa did not produce an ISO."
            exit 1
          fi
          sudo mv -f "${iso_file}" "output/${ISO_NAME}"
          sudo chown "$(id -u):$(id -g)" "output/${ISO_NAME}"

      - name: Generate checksum
        run: |
          set -euo pipefail
          cd output
          sha256sum "${ISO_NAME}" | tee "${ISO_NAME}.sha256"

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign ISO
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          set -euo pipefail
          iso="output/${ISO_NAME}"
          cosign sign-blob -y --key env://COSIGN_PRIVATE_KEY "${iso}" \
            --bundle "${iso}.bundle"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: output/*.iso

      # The live initramfs is built with the livenet dracut module, so the
      # kernel, initrd, and squashfs are directly bootable over the network.
      - name: Extract netboot assets
        run: |
          set -euo pipefail
          iso="output/${ISO_NAME}"
          netboot="output/netboot/${TARGET_IMAGE}"
          mkdir -p "${netboot}"
          mnt="$(mktemp -d)"
          trap 'sudo umount "${mnt}" 2>/dev/null || true; rmdir "${mnt}" 2>/dev/null || true' EXIT
          sudo mount -o loop,ro "${iso}" "${mnt}"
          sudo cp "${mnt}/images/pxeboot/vmlinuz" "${netboot}/vmlinuz"
          sudo cp "${mnt}/images/pxeboot/initrd.img" "${netboot}/initrd.img"
          sudo cp "${mnt}/LiveOS/squashfs.img" "${netboot}/squashfs.img"
          sudo umount "${mnt}"
          rmdir "${mnt}"
          sudo chown -R "$(id -u):$(id -g)" output
          echo "Extracted netboot assets for ${TARGET_IMAGE}"

      - name: Verify initrd supports network live root
        run: |
          set -euo pipefail
          if ! sudo podman run --rm \
              --security-opt label=disable \
              --entrypoint /usr/bin/lsinitrd \
              -v "${GITHUB_WORKSPACE}/output/netboot/${TARGET_IMAGE}/initrd.img:/tmp/initrd.img:ro" \
              "localhost/payload-${TARGET_IMAGE}:${DEFAULT_TAG}" \
              /tmp/initrd.img | grep -q 'parse-livenet'; then
            echo "::error::initrd is missing the livenet module; netboot will not work."
            exit 1
          fi

      - name: Generate manifest
        run: |
          set -euo pipefail
          netboot="output/netboot/${TARGET_IMAGE}"
          jq -n \
            --arg flavor "${TARGET_IMAGE}" \
            --arg date "${BUILD_DATE}" \
            --arg base_url "${ISO_BASE_URL}" \
            --arg ref "${IMAGE_REGISTRY}/${TARGET_IMAGE}:${DEFAULT_TAG}" \
            --arg digest "${{ steps.digest.outputs.digest }}" \
            --arg git_sha "${GITHUB_SHA}" \
            --arg iso_sha "$(cut -d' ' -f1 "output/${ISO_NAME}.sha256")" \
            --arg iso_size "$(stat -c %s "output/${ISO_NAME}")" \
            --arg vmlinuz_sha "$(sha256sum "${netboot}/vmlinuz" | cut -d' ' -f1)" \
            --arg vmlinuz_size "$(stat -c %s "${netboot}/vmlinuz")" \
            --arg initrd_sha "$(sha256sum "${netboot}/initrd.img" | cut -d' ' -f1)" \
            --arg initrd_size "$(stat -c %s "${netboot}/initrd.img")" \
            --arg squashfs_sha "$(sha256sum "${netboot}/squashfs.img" | cut -d' ' -f1)" \
            --arg squashfs_size "$(stat -c %s "${netboot}/squashfs.img")" \
            '{
              flavor: $flavor,
              date: $date,
              image: { ref: $ref, digest: $digest, git_sha: $git_sha },
              iso: {
                name: ($flavor + "-live-amd64.iso"),
                sha256: $iso_sha,
                size: ($iso_size | tonumber)
              },
              netboot: {
                vmlinuz: { sha256: $vmlinuz_sha, size: ($vmlinuz_size | tonumber) },
                initrd: { sha256: $initrd_sha, size: ($initrd_size | tonumber) },
                squashfs: { sha256: $squashfs_sha, size: ($squashfs_size | tonumber) },
                kernel_args: "rd.live.image enforcing=0 quiet"
              },
              urls: {
                iso: ($base_url + "/live/" + $date + "/" + $flavor + "-live-amd64.iso"),
                checksum: ($base_url + "/live/" + $date + "/" + $flavor + "-live-amd64.iso.sha256"),
                bundle: ($base_url + "/live/" + $date + "/" + $flavor + "-live-amd64.iso.bundle"),
                netboot: {
                  kernel: ($base_url + "/live/" + $date + "/netboot/" + $flavor + "/vmlinuz"),
                  initrd: ($base_url + "/live/" + $date + "/netboot/" + $flavor + "/initrd.img"),
                  squashfs: ($base_url + "/live/" + $date + "/netboot/" + $flavor + "/squashfs.img")
                }
              }
            }' > "${netboot}/manifest.json"

      - name: Install rclone
        run: |
          set -euo pipefail
          version="$(curl -fsSL https://downloads.rclone.org/version.txt | awk '{print $2}')"
          curl -fsSL -o "${RUNNER_TEMP}/rclone.deb" \
            "https://downloads.rclone.org/${version}/rclone-${version}-linux-amd64.deb"
          sudo dpkg -i --force-overwrite "${RUNNER_TEMP}/rclone.deb"
          rclone version | head -1

      - name: Upload ISO to B2
        run: |
          set -euo pipefail
          dest="b2:${ISO_BUCKET}/bazzite/live/${BUILD_DATE}"
          rclone copy "output/${ISO_NAME}" "${dest}/" \
            --checksum --retries 3 --low-level-retries 10
          rclone copy "output/${ISO_NAME}.sha256" "${dest}/" --checksum
          rclone copy "output/${ISO_NAME}.bundle" "${dest}/" --checksum

      - name: Upload netboot assets to B2
        run: |
          set -euo pipefail
          dest="b2:${ISO_BUCKET}/bazzite/live/${BUILD_DATE}/netboot/${TARGET_IMAGE}"
          rclone copy "output/netboot/${TARGET_IMAGE}" "${dest}/" \
            --checksum --retries 3 --low-level-retries 10

      - name: Verify uploaded objects
        run: |
          set -euo pipefail
          base="b2:${ISO_BUCKET}/bazzite/live/${BUILD_DATE}"
          rclone check "output/netboot/${TARGET_IMAGE}" "${base}/netboot/${TARGET_IMAGE}" --one-way
          rclone check output "${base}" --one-way \
            --include "${ISO_NAME}" \
            --include "${ISO_NAME}.sha256" \
            --include "${ISO_NAME}.bundle"

      # Only promote after the dated objects are verified. A failed build
      # leaves the previous week's stable link untouched.
      - name: Publish stable aliases
        run: |
          set -euo pipefail
          for suffix in "" ".sha256" ".bundle"; do
            rclone copyto \
              "b2:${ISO_BUCKET}/bazzite/live/${BUILD_DATE}/${ISO_NAME}${suffix}" \
              "b2:${ISO_BUCKET}/bazzite/latest/${ISO_NAME}${suffix}"
          done

      - name: Clean up payload image
        if: always()
        run: |
          sudo podman rmi -f "localhost/payload-${TARGET_IMAGE}:${DEFAULT_TAG}" || true

      - name: Clean up workspace output
        if: always()
        run: sudo rm -rf "${GITHUB_WORKSPACE}/output"

  publish:
    name: Publish ISO index
    needs: build
    if: always() && needs.build.result != 'cancelled'
    runs-on: self-hosted
    permissions:
      contents: read
    env:
      RCLONE_CONFIG_B2_TYPE: b2
      RCLONE_CONFIG_B2_ACCOUNT: ${{ secrets.B2_APPLICATION_KEY_ID }}
      RCLONE_CONFIG_B2_KEY: ${{ secrets.B2_APPLICATION_KEY }}

    steps:
      - name: Install rclone
        run: |
          set -euo pipefail
          version="$(curl -fsSL https://downloads.rclone.org/version.txt | awk '{print $2}')"
          curl -fsSL -o "${RUNNER_TEMP}/rclone.deb" \
            "https://downloads.rclone.org/${version}/rclone-${version}-linux-amd64.deb"
          sudo dpkg -i --force-overwrite "${RUNNER_TEMP}/rclone.deb"
          rclone version | head -1

      - name: Build and upload index
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "${tmp}"' EXIT

          rclone lsf --dirs-only "b2:${ISO_BUCKET}/bazzite/live/" \
            | sed 's:/$::' \
            | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' \
            | sort > "${tmp}/dates" || true

          jq -n --arg base_url "${ISO_BASE_URL}" \
            '{generated_at: "", base_url: $base_url, flavors: {}}' > "${tmp}/index.json"

          for flavor in ${LIVE_FLAVORS}; do
            echo '{}' > "${tmp}/releases.json"
            latest=""
            while read -r date; do
              manifest="b2:${ISO_BUCKET}/bazzite/live/${date}/netboot/${flavor}/manifest.json"
              if rclone cat "${manifest}" > "${tmp}/manifest.json" 2>/dev/null; then
                jq --arg date "${date}" --slurpfile m "${tmp}/manifest.json" \
                  '. + {($date): $m[0]}' "${tmp}/releases.json" > "${tmp}/releases.new"
                mv "${tmp}/releases.new" "${tmp}/releases.json"
                if [[ -z "${latest}" ]]; then
                  latest="${date}"
                fi
              fi
            done < <(tac "${tmp}/dates")
            jq --arg flavor "${flavor}" --arg latest "${latest}" \
              --slurpfile r "${tmp}/releases.json" \
              '.flavors[$flavor] = {latest: $latest, releases: $r[0]}' \
              "${tmp}/index.json" > "${tmp}/index.new"
            mv "${tmp}/index.new" "${tmp}/index.json"
          done

          jq '.generated_at = (now | todate)' "${tmp}/index.json" > "${tmp}/index.new"
          mv "${tmp}/index.new" "${tmp}/index.json"
          rclone copyto "${tmp}/index.json" "b2:${ISO_BUCKET}/bazzite/latest/index.json"
          cat "${tmp}/index.json"
